{% extends "base.html" %}

{% block content %}
<!-- 全螢幕待轉警示遮罩 (當進入警示區時閃爍黃/藍色或高對比框線) -->
<div id="turn-alert-mask" class="d-none position-fixed top-0 start-0 w-100 h-100" 
     style="z-index: 9999; pointer-events: none; mix-blend-mode: overlay; animation: pulse-yellow 1.2s infinite;">
</div>

<div class="container-fluid px-4">
    <div class="row g-4">
        <!-- 1. 左側地圖展示區 -->
        <div class="col-lg-8">
            <div class="position-relative">
                <div id="map"></div>
                <!-- 地圖疊加提示 -->
                <div class="position-absolute bottom-0 start-0 m-3 p-2 bg-dark bg-opacity-75 rounded text-white small" style="z-index: 1000;">
                    <i class="fa-solid fa-circle-info text-info me-1"></i> 藍色線段為行駛模擬路線，紅色圓形標示為待轉路口。
                </div>
            </div>
        </div>
        
        <!-- 2. 右側待轉儀表板與控制器 -->
        <div class="col-lg-4">
            <!-- 2.1 主儀表板 -->
            <div class="glass-card mb-4 text-center d-flex flex-column align-items-center justify-content-center p-4">
                <!-- 定位狀態與路段資訊 -->
                <div class="mb-3">
                    <span class="badge bg-secondary mb-1" id="gps-status"><i class="fa-solid fa-location-crosshairs me-1"></i>定位準備就緒</span>
                    <h3 class="fw-bold mb-1" id="current-road-name">點擊「開始導航」</h3>
                    <p class="text-muted small mb-0" id="current-coords">座標: --, --</p>
                </div>
                
                <!-- 待轉警告大圖標與剩餘公尺倒數 (核心 UI) -->
                <div class="position-relative my-4" style="width: 220px; height: 220px;">
                    <!-- 圓形底環 -->
                    <div id="alert-gauge-border" class="position-absolute top-0 start-0 w-100 h-100 rounded-circle border border-5 border-secondary" style="transition: all 0.3s ease;"></div>
                    
                    <!-- 中央待轉圖示與距離倒數 -->
                    <div class="position-absolute top-50 start-50 translate-middle text-center w-75">
                        <div id="turn-icon-container" class="d-none mb-2">
                            <img src="{{ url_for('static', filename='images/two_stage_turn.png') }}" alt="待轉標誌" style="width: 75px; height: 75px; animation: bounce-icon 1.2s infinite;">
                        </div>
                        <div class="fw-bold text-secondary" id="warning-label" style="font-size: 1rem;">安全騎乘中</div>
                        <div class="display-6 fw-bold mt-1 text-primary d-none" id="countdown-text">-- m</div>
                    </div>
                </div>

                <!-- 待轉狀態警示橫幅 -->
                <div class="w-100 py-2 rounded mb-3 text-center fw-bold text-uppercase fs-sm border" id="alert-indicator" 
                     style="background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); color: var(--text-secondary); transition: all 0.2s ease;">
                    未開始導航
                </div>

                <!-- 按鈕列 -->
                <div class="d-grid gap-2 w-100">
                    <button class="btn-premium btn-lg" id="start-nav-btn">
                        <i class="fa-solid fa-play me-2"></i>開始導航 (解鎖語音)
                    </button>
                    <button class="btn btn-outline-warning" id="contrast-toggle-btn">
                        <i class="fa-solid fa-circle-half-stroke me-2"></i>切換高對比模式
                    </button>
                </div>
            </div>

            <!-- 2.2 定位與騎乘模式控制 -->
            <div class="glass-card">
                <h5 class="fw-bold mb-3 text-info"><i class="fa-solid fa-location-arrow me-2"></i>定位與騎乘控制</h5>
                
                <!-- 選擇運作模式 -->
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">1. 選擇定位模式</label>
                    <div class="d-flex gap-2">
                        <input type="radio" class="btn-check" name="navigation-mode" id="mode-sim" value="sim" checked>
                        <label class="btn btn-outline-info flex-fill" for="mode-sim">
                            <i class="fa-solid fa-laptop-code me-1"></i> 模擬模式
                        </label>
                        
                        <input type="radio" class="btn-check" name="navigation-mode" id="mode-gps" value="gps">
                        <label class="btn btn-outline-info flex-fill" for="mode-gps">
                            <i class="fa-solid fa-satellite-dish me-1"></i> 真實 GPS
                        </label>
                    </div>
                </div>

                <div id="sim-controls">
                    <!-- 選擇模擬路段 -->
                    <div class="mb-3">
                        <label class="form-label text-secondary small">2. 選擇模擬路段 (配合模擬路口)</label>
                        <select class="form-select custom-input" id="sim-road-select">
                            <option value="chongyang">忠孝東路三段 (含新生/復興兩待轉路口)</option>
                            <option value="beiyi">北宜公路30K (含北宜公路待轉路口)</option>
                        </select>
                    </div>

                    <!-- 模擬行駛進度 -->
                    <div class="mb-3">
                        <label class="form-label text-secondary small d-flex justify-content-between">
                            <span>3. 模擬行車進度 (沿道路移動)</span>
                            <span class="fw-bold text-info" id="sim-progress-val">0%</span>
                        </label>
                        <input type="range" class="form-range" id="sim-progress-slider" min="0" max="100" value="0" disabled>
                    </div>

                    <!-- 模擬行車時速 -->
                    <div class="mb-3">
                        <label class="form-label text-secondary small d-flex justify-content-between">
                            <span>4. 模擬行車時速</span>
                            <span class="fw-bold text-info" id="sim-speed-val">0 km/h</span>
                        </label>
                        <input type="range" class="form-range" id="sim-speed-slider" min="0" max="80" value="0" disabled>
                    </div>
                </div>
                
                <div id="gps-instructions" class="d-none mb-3 p-3 rounded" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2);">
                    <div class="text-info small fw-bold mb-1"><i class="fa-solid fa-circle-info me-1"></i>真實 GPS 模式說明</div>
                    <div class="text-secondary" style="font-size: 0.8rem; line-height: 1.4;">
                        系統將使用您行動裝置的 GPS 晶片進行即時定位。進入任何待轉路口前 30-50m 內，會自動觸發倒數與語音警示。
                    </div>
                </div>
                
                <div class="form-text text-muted small mt-2" id="controls-help-text">
                    <i class="fa-solid fa-circle-question me-1"></i>
                    請先點擊上方**「開始導航」**解鎖瀏覽器語音合成，即可拖動滑桿模擬騎士行駛位置與車速。
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 動態 CSS 動畫與自訂微調樣式 -->
<style>
@keyframes pulse-yellow {
    0% { background-color: rgba(245, 158, 11, 0); }
    50% { background-color: rgba(245, 158, 11, 0.25); }
    100% { background-color: rgba(245, 158, 11, 0); }
}
@keyframes bounce-icon {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.05); }
}
.turn-alert-flash {
    animation: turn-border-flash 0.8s infinite;
}
@keyframes turn-border-flash {
    0% { border-color: #3b82f6; box-shadow: 0 0 0px #3b82f6; }
    50% { border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
    100% { border-color: #3b82f6; box-shadow: 0 0 0px #3b82f6; }
}
</style>
{% endblock %}

{% block extra_js %}
<script>
    // 讀取從後端經由 Jinja2 傳遞的 UserSettings 設定參數
    const warningThreshold = parseInt("{{ settings.warning_threshold }}");
    const enableVoiceAlert = parseInt("{{ settings.enable_voice_alert }}");
    const enableAutoBrightness = parseInt("{{ settings.enable_auto_brightness }}");

    // 全域變數
    let map;
    let riderMarker;
    let roadPolyline;
    let mockIntersectionMarkers = [];
    let isNavigating = false;
    let voiceSynth = window.speechSynthesis;

    // GPS 追蹤相關變數
    let gpsWatchId = null;
    let lastGpsCoords = null;
    let lastGpsTime = null;
    let activeIntersectionId = null;
    let hasSpokenForIntersection = false;

    // 模擬路段之經緯度座標數據
    const roadCoords = {
        chongyang: {
            start: [25.042, 121.530],
            end: [25.042, 121.550],
            intersections: [
                { name: "忠孝新生路口", coords: [25.042, 121.535] },
                { name: "忠孝復興路口", coords: [25.042, 121.543] }
            ]
        },
        beiyi: {
            start: [24.985, 121.580],
            end: [24.970, 121.590],
            intersections: [
                { name: "北宜公路待轉路口", coords: [24.978, 121.585] }
            ]
        }
    };

    // 目前行駛狀態資訊
    let currentSpeed = 0;

    // 初始化 Leaflet 地圖
    function initMap() {
        map = L.map('map').setView([25.0479, 121.5173], 14);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        riderMarker = L.marker([25.0479, 121.5173]).addTo(map);
        riderMarker.bindPopup("<b>目前騎士位置</b>").openPopup();

        drawRoadLine('chongyang');
    }

    // 繪製模擬道路線段與路口標記
    function drawRoadLine(roadType) {
        if (roadPolyline) {
            map.removeLayer(roadPolyline);
        }
        mockIntersectionMarkers.forEach(m => map.removeLayer(m));
        mockIntersectionMarkers = [];

        const data = roadCoords[roadType];
        
        roadPolyline = L.polyline([data.start, data.end], {
            color: '#3b82f6',
            weight: 6,
            opacity: 0.8
        }).addTo(map);

        // 繪製路口標記
        data.intersections.forEach(item => {
            const marker = L.circle(item.coords, {
                color: '#ef4444',
                fillColor: '#f87171',
                fillOpacity: 0.5,
                radius: 50 // 待轉警示範圍 (50公尺)
            }).addTo(map);
            marker.bindPopup(`<b>${item.name}</b><br>待轉警示區 (50m)`);
            mockIntersectionMarkers.push(marker);
        });

        map.fitBounds(roadPolyline.getBounds(), { padding: [50, 50] });
    }

    // 計算大圓距離（公尺）- 用於 GPS 速度與待轉距離計算
    function distanceInMeters(lat1, lng1, lat2, lng2) {
        const R = 6371000.0;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLng / 2) * Math.sin(dLng / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    // 播放語音警示 (Web Speech API)
    function speakWarning() {
        if (enableVoiceAlert !== 1) return;
        try {
            voiceSynth.cancel(); // 停止目前播放的所有語音
            const utterance = new SpeechSynthesisUtterance("前方路口請進行兩段式轉彎");
            utterance.lang = "zh-TW";
            utterance.volume = 1.0;
            utterance.rate = 1.0;
            voiceSynth.speak(utterance);
        } catch (e) {
            console.error("語音播放失敗: ", e);
        }
    }

    // 核心警示判定與 UI 呈現
    function handleTurnAlert(match, dist, name) {
        const turnIcon = document.getElementById('turn-icon-container');
        const warningLabel = document.getElementById('warning-label');
        const countdownText = document.getElementById('countdown-text');
        const alertIndicator = document.getElementById('alert-indicator');
        const alertGauge = document.getElementById('alert-gauge-border');
        const alertMask = document.getElementById('turn-alert-mask');

        if (!isNavigating) {
            alertIndicator.textContent = "未開始導航";
            alertIndicator.style.background = "rgba(255, 255, 255, 0.05)";
            alertIndicator.style.color = "var(--text-secondary)";
            alertGauge.className = "position-absolute top-0 start-0 w-100 h-100 rounded-circle border border-5 border-secondary";
            turnIcon.classList.add('d-none');
            countdownText.classList.add('d-none');
            warningLabel.textContent = "安全騎乘中";
            warningLabel.className = "fw-bold text-secondary";
            alertMask.classList.add('d-none');
            return;
        }

        // 處於待轉路口前 30m - 50m 警示區
        if (match && dist <= warningThreshold && dist >= 30.0) {
            warningLabel.textContent = "兩段式左轉預告";
            warningLabel.className = "fw-bold text-warning";
            countdownText.textContent = `${Math.round(dist)} m`;
            countdownText.classList.remove('d-none');
            turnIcon.classList.remove('d-none');
            
            alertIndicator.textContent = `待轉警告！${name}`;
            alertIndicator.style.background = "rgba(245, 158, 11, 0.25)";
            alertIndicator.style.borderColor = "#f59e0b";
            alertIndicator.style.color = "#fbbf24";

            alertGauge.className = "position-absolute top-0 start-0 w-100 h-100 rounded-circle border border-5 turn-alert-flash";
            alertMask.classList.remove('d-none');

            // 觸發語音 (一次性)
            if (!hasSpokenForIntersection) {
                speakWarning();
                hasSpokenForIntersection = true;
            }
        } 
        else {
            // 安全區
            warningLabel.textContent = "安全騎乘中";
            warningLabel.className = "fw-bold text-success";
            countdownText.classList.add('d-none');
            turnIcon.classList.add('d-none');
            
            alertIndicator.textContent = "狀態安全";
            alertIndicator.style.background = "rgba(16, 185, 129, 0.15)";
            alertIndicator.style.borderColor = "#10b981";
            alertIndicator.style.color = "#34d399";

            alertGauge.className = "position-absolute top-0 start-0 w-100 h-100 rounded-circle border border-5 border-success";
            alertMask.classList.add('d-none');

            // 若使用者離開待轉區，重設語音狀態
            if (dist > warningThreshold + 10.0 || dist < 20.0) {
                hasSpokenForIntersection = false;
            }
        }
    }

    // 呼叫後端 API 進行路口比對與距離計算
    function checkIntersectionAPI(lat, lng) {
        fetch('/api/intersection/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ latitude: lat, longitude: lng })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                if (data.match && data.need_two_stage_turn === 1) {
                    // 計算騎士到路口中心的精確大圓距離
                    const dist = distanceInMeters(lat, lng, data.center_lat, data.center_lng);
                    document.getElementById('current-road-name').textContent = data.intersection_name;
                    handleTurnAlert(true, dist, data.intersection_name);
                } else {
                    document.getElementById('current-road-name').textContent = "一般行駛路段";
                    handleTurnAlert(false, 999, "");
                }
            }
        })
        .catch(err => console.error("路口檢查 API 失敗: ", err));
    }

    // 依行車進度比例 (0 - 100) 插值計算當前經緯度
    function updateRiderPosition(progressPct) {
        const roadType = document.getElementById('sim-road-select').value;
        const roadData = roadCoords[roadType];
        
        const ratio = progressPct / 100.0;
        const lat = roadData.start[0] + (roadData.end[0] - roadData.start[0]) * ratio;
        const lng = roadData.start[1] + (roadData.end[1] - roadData.start[1]) * ratio;

        const newLatLng = new L.LatLng(lat, lng);
        riderMarker.setLatLng(newLatLng);
        map.panTo(newLatLng);

        document.getElementById('current-coords').textContent = `座標: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

        if (isNavigating) {
            checkIntersectionAPI(lat, lng);
        }
    }

    // GPS 成功定位回傳
    function onGpsSuccess(position) {
        if (!isNavigating) return;

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const timestamp = position.timestamp;

        const newLatLng = new L.LatLng(lat, lng);
        riderMarker.setLatLng(newLatLng);
        map.panTo(newLatLng);

        document.getElementById('current-coords').textContent = `座標: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        document.getElementById('gps-status').className = "badge bg-success mb-1";
        document.getElementById('gps-status').innerHTML = '<i class="fa-solid fa-satellite-dish me-1"></i>GPS 定位追蹤中';

        // 估算或獲取車速
        let speedKmh = 0;
        if (position.coords.speed !== null && position.coords.speed !== undefined && position.coords.speed >= 0) {
            speedKmh = Math.round(position.coords.speed * 3.6);
        } else {
            if (lastGpsCoords && lastGpsTime && timestamp > lastGpsTime) {
                const distM = distanceInMeters(lastGpsCoords.lat, lastGpsCoords.lng, lat, lng);
                const durationS = (timestamp - lastGpsTime) / 1000.0;
                if (durationS > 0) {
                    const calculatedKmh = (distM / durationS) * 3.6;
                    if (calculatedKmh < 180.0) {
                        speedKmh = Math.round(calculatedKmh);
                    }
                }
            }
        }

        lastGpsCoords = { lat, lng };
        lastGpsTime = timestamp;

        checkIntersectionAPI(lat, lng);
    }

    // GPS 定位失敗處理
    function onGpsError(error) {
        console.error("GPS 定位失敗: ", error);
        let errorMsg = "定位錯誤";
        switch (error.code) {
            case error.PERMISSION_DENIED:
                errorMsg = "權限不足，請在瀏覽器中允許定位";
                break;
            case error.POSITION_UNAVAILABLE:
                errorMsg = "GPS 訊號弱或無法獲取位置";
                break;
            case error.TIMEOUT:
                errorMsg = "GPS 定位超時";
                break;
        }
        document.getElementById('gps-status').className = "badge bg-warning text-dark mb-1";
        document.getElementById('gps-status').innerHTML = `<i class="fa-solid fa-circle-exclamation me-1"></i>${errorMsg}`;
    }

    // 環境光線與亮度模式檢查
    function checkBrightnessAndMode() {
        if (enableAutoBrightness !== 1) {
            document.body.classList.remove('night-mode');
            return;
        }
        
        // 1. 優先嘗試 Ambient Light Sensor API
        if ('AmbientLightSensor' in window) {
            try {
                const sensor = new AmbientLightSensor();
                sensor.onreading = () => {
                    if (sensor.illuminance < 10) {
                        document.body.classList.add('night-mode');
                    } else {
                        document.body.classList.remove('night-mode');
                    }
                };
                sensor.onerror = (event) => {
                    console.warn("AmbientLightSensor 發生錯誤，改為時間排程判定:", event.error.message);
                    timeFallback();
                };
                sensor.start();
                return;
            } catch (e) {
                console.warn("光感應器啟動失敗，使用時間排程:", e);
            }
        }
        
        // 2. 時間排程 Fallback (18:00 - 06:00 觸發夜間模式)
        timeFallback();
    }

    function timeFallback() {
        const hour = new Date().getHours();
        if (hour >= 18 || hour < 6) {
            document.body.classList.add('night-mode');
        } else {
            document.body.classList.remove('night-mode');
        }
    }

    // 綁定 UI 操作事件
    document.addEventListener("DOMContentLoaded", function() {
        initMap();
        checkBrightnessAndMode();

        const startNavBtn = document.getElementById('start-nav-btn');
        const simRoadSelect = document.getElementById('sim-road-select');
        const simProgressSlider = document.getElementById('sim-progress-slider');
        const simProgressVal = document.getElementById('sim-progress-val');
        const simSpeedSlider = document.getElementById('sim-speed-slider');
        const simSpeedVal = document.getElementById('sim-speed-val');
        const contrastToggleBtn = document.getElementById('contrast-toggle-btn');

        // 模式切換控制
        const modeSim = document.getElementById('mode-sim');
        const modeGps = document.getElementById('mode-gps');
        const simControls = document.getElementById('sim-controls');
        const gpsInstructions = document.getElementById('gps-instructions');
        const controlsHelpText = document.getElementById('controls-help-text');

        function updateModeUI() {
            if (isNavigating) {
                startNavBtn.click();
            }
            if (modeGps.checked) {
                simControls.classList.add('d-none');
                gpsInstructions.classList.remove('d-none');
                controlsHelpText.innerHTML = '<i class="fa-solid fa-circle-info me-1"></i> 請點擊上方**「開始導航」**啟動真實 GPS 定位與待轉預告監測。';
            } else {
                simControls.classList.remove('d-none');
                gpsInstructions.classList.add('d-none');
                controlsHelpText.innerHTML = '<i class="fa-solid fa-circle-question me-1"></i> 請先點擊上方**「開始導航」**解鎖瀏覽器語音功能，即可拖動滑桿模擬騎士行駛位置與路口距離。';
            }
        }

        modeSim.addEventListener('change', updateModeUI);
        modeGps.addEventListener('change', updateModeUI);

        // A. 「開始導航」點擊事件
        startNavBtn.addEventListener('click', function() {
            const isGpsMode = modeGps.checked;

            if (!isNavigating) {
                isNavigating = true;
                this.innerHTML = '<i class="fa-solid fa-stop me-2"></i>停止導航';
                this.classList.replace('btn-premium', 'btn-danger');
                
                // 語音引擎預熱解鎖
                if (voiceSynth) {
                    const setupUtter = new SpeechSynthesisUtterance("");
                    voiceSynth.speak(setupUtter);
                }
                
                if (isGpsMode) {
                    document.getElementById('gps-status').className = "badge bg-warning text-dark mb-1";
                    document.getElementById('gps-status').innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>尋找 GPS 定位中...';
                    
                    lastGpsCoords = null;
                    lastGpsTime = null;
                    hasSpokenForIntersection = false;
                    
                    gpsWatchId = navigator.geolocation.watchPosition(onGpsSuccess, onGpsError, {
                        enableHighAccuracy: true,
                        maximumAge: 1000,
                        timeout: 10000
                    });
                } else {
                    document.getElementById('gps-status').className = "badge bg-success mb-1";
                    document.getElementById('gps-status').innerHTML = '<i class="fa-solid fa-satellite-dish me-1"></i>模擬定位中';
                    
                    simProgressSlider.disabled = false;
                    simSpeedSlider.disabled = false;
                    hasSpokenForIntersection = false;
                    
                    updateRiderPosition(parseInt(simProgressSlider.value));
                }
            } else {
                isNavigating = false;
                this.innerHTML = '<i class="fa-solid fa-play me-2"></i>開始導航 (解鎖語音)';
                this.classList.replace('btn-danger', 'btn-premium');
                document.getElementById('gps-status').className = "badge bg-secondary mb-1";
                document.getElementById('gps-status').innerHTML = '<i class="fa-solid fa-location-crosshairs me-1"></i>定位準備就緒';
                
                if (gpsWatchId !== null) {
                    navigator.geolocation.clearWatch(gpsWatchId);
                    gpsWatchId = null;
                }

                simProgressSlider.disabled = true;
                simSpeedSlider.disabled = true;
                
                document.getElementById('current-road-name').textContent = "點擊「開始導航」";
                document.getElementById('current-coords').textContent = "座標: --, --";
                
                hasSpokenForIntersection = false;
                handleTurnAlert(false, 999, "");
            }
        });

        // B. 切換模擬路段
        simRoadSelect.addEventListener('change', function() {
            drawRoadLine(this.value);
            simProgressSlider.value = 0;
            simProgressVal.textContent = "0%";
            updateRiderPosition(0);
        });

        // C. 模擬行駛進度滑桿滑動
        simProgressSlider.addEventListener('input', function() {
            simProgressVal.textContent = this.value + "%";
            updateRiderPosition(parseInt(this.value));
        });

        // D. 模擬時速滑桿滑動
        simSpeedSlider.addEventListener('input', function() {
            currentSpeed = parseInt(this.value);
            simSpeedVal.textContent = currentSpeed + " km/h";
        });

        // E. 切換高對比模式 (透過 JS add/remove class 切換 CSS)
        contrastToggleBtn.addEventListener('click', function() {
            document.body.classList.toggle('high-contrast');
            if (document.body.classList.contains('high-contrast')) {
                this.innerHTML = '<i class="fa-solid fa-circle-half-stroke me-2"></i>正常顯示模式';
                this.className = "btn btn-yellow w-100 mt-2";
            } else {
                this.innerHTML = '<i class="fa-solid fa-circle-half-stroke me-2"></i>高對比模式';
                this.className = "btn btn-outline-warning w-100 mt-2";
            }
        });
    });
</script>
{% endblock %}
