{% extends "base.html" %}

{% block extra_css %}
<style>
    /* 全螢幕地圖佈局 */
    #map-wrapper {
        position: relative;
        height: calc(100vh - 56px); /* 扣除 navbar 的高度 */
        width: 100%;
        overflow: hidden;
    }

    #map {
        height: 100%;
        width: 100%;
        z-index: 1;
    }

    /* 精美側邊控制面板 */
    .control-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 380px;
        max-height: calc(100% - 40px);
        background: var(--card-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        z-index: 100;
        padding: 24px;
        overflow-y: auto;
        transition: transform 0.3s ease;
    }

    /* 懸浮警示面板 (超速與待轉) */
    .alert-hud {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 15px;
        pointer-events: none;
    }

    .hud-card {
        background: rgba(0, 0, 0, 0.85);
        color: #ffffff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 15px;
        animation: slideInRight 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        min-width: 250px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        pointer-events: auto;
    }

    /* 超速閃紅特效 */
    @keyframes pulse-red {
        0% { box-shadow: inset 0 0 0 0px rgba(239, 35, 60, 0); }
        50% { box-shadow: inset 0 0 50px 20px rgba(239, 35, 60, 0.5); }
        100% { box-shadow: inset 0 0 0 0px rgba(239, 35, 60, 0); }
    }

    .overspeed-warning-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 99;
        pointer-events: none;
        animation: pulse-red 1.5s infinite;
        display: none;
    }

    .speed-limit-sign {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #ffffff;
        border: 8px solid #ef233c;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-weight: 800;
        font-size: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .hook-turn-sign {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        background: #4361ee;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 28px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* 一鍵路障回報面板 */
    .hazard-report-deck {
        margin-top: 20px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
        padding-top: 15px;
    }

    .hazard-btn {
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 10px;
        color: #ffffff;
        font-weight: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        transition: transform 0.2s;
    }

    .hazard-btn:hover {
        transform: scale(1.05);
    }

    .btn-accident { background: #ef233c; }
    .btn-construction { background: #f77f00; }
    .btn-obstacle { background: #6c757d; }

    /* 滑入動畫 */
    @keyframes slideInRight {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
</style>
{% endblock %}

{% block content %}
<div id="map-wrapper">
    <!-- 超速紅屏特效層 -->
    <div class="overspeed-warning-screen" id="overspeedScreen"></div>

    <!-- 地圖主區塊 -->
    <div id="map"></div>

    <!-- 懸浮警示 HUD -->
    <div class="alert-hud">
        <!-- 測速照相 HUD (超速警告) -->
        <div class="hud-card" id="speedHud" style="display: none;">
            <div class="speed-limit-sign" id="speedHudLimit">50</div>
            <div>
                <h6 class="m-0 text-danger"><i class="fa-solid fa-gauge-high me-1"></i>前方有測速照相！</h6>
                <small class="text-white-50" id="speedHudDesc">限速 50 公里，請減速慢行</small>
            </div>
        </div>

        <!-- 兩段式待轉 HUD -->
        <div class="hud-card" id="turnHud" style="display: none;">
            <div class="hook-turn-sign">
                <i class="fa-solid fa-arrows-turn-to-dots"></i>
            </div>
            <div>
                <h6 class="m-0 text-info"><i class="fa-solid fa-route me-1"></i>前方待轉預告</h6>
                <small class="text-white-50" id="turnHudDesc">接近路口，請切至外側車道待轉</small>
            </div>
        </div>
    </div>

    <!-- 精美側邊控制面板 -->
    <div class="control-panel">
        <h4 class="mb-3 text-primary"><i class="fa-solid fa-location-arrow me-2"></i>開始導航</h4>
        
        <!-- 起迄點與偏好表單 -->
        <div class="mb-3">
            <label class="form-label font-semibold">當前起點</label>
            <div class="input-group mb-2">
                <span class="input-group-text"><i class="fa-solid fa-location-crosshairs text-success"></i></span>
                <input type="text" class="form-control" id="startInput" value="台北市政府" readonly>
            </div>
            
            <label class="form-label font-semibold">搜尋終點</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-location-dot text-danger"></i></span>
                <input type="text" class="form-control" id="destInput" placeholder="請輸入目的地 (例如：台北101)">
            </div>
        </div>

        <!-- 個人化路線條件 -->
        <div class="card p-3 mb-3 border-0 bg-light">
            <h6 class="text-secondary mb-2"><i class="fa-solid fa-sliders me-1"></i>個人化偏好規劃</h6>
            <div class="form-check form-switch mb-2">
                <input class="form-check-switch form-check-input" type="checkbox" id="avoidHighways">
                <label class="form-check-label" for="avoidHighways">避開高架/快速道路 (機車優先)</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-switch form-check-input" type="checkbox" id="preferWide">
                <label class="form-check-label" for="preferWide">偏好平面寬敞大路</label>
            </div>
        </div>

        <!-- 導航功能按鈕 -->
        <button class="btn btn-custom w-100 mb-3" onclick="planRoute()">
            <i class="fa-solid fa-magnifying-glass-location me-2"></i>開始規劃路線
        </button>

        <!-- 模擬導航面板 (開始規劃後顯示) -->
        <div id="simPanel" style="display: none;" class="border-top pt-3">
            <h6 class="text-primary mb-2"><i class="fa-solid fa-car me-1"></i>導航模擬監控</h6>
            <div class="row text-center mb-3">
                <div class="col-6 border-end">
                    <small class="text-muted d-block">當前時速</small>
                    <span class="h4" id="simSpeed">0</span> <small>km/h</small>
                </div>
                <div class="col-6">
                    <small class="text-muted d-block">預估剩餘時間</small>
                    <span class="h4" id="simTime">--</span> <small>分鐘</small>
                </div>
            </div>
            <button class="btn btn-success w-100" id="simBtn" onclick="toggleSimulation()">
                <i class="fa-solid fa-play me-2"></i>開始模擬行車導航
            </button>
        </div>

        <!-- 一鍵路障回報面板 -->
        <div class="hazard-report-deck">
            <h6 class="text-secondary mb-2"><i class="fa-solid fa-bullhorn me-1"></i>即時路障一鍵回報</h6>
            <p class="text-muted small">點選按鈕，系統會將您回報的路障標記在地圖上，供其他用路人參考。</p>
            <div class="d-flex gap-2">
                <button class="hazard-btn btn-accident" onclick="reportHazard('accident')">
                    <i class="fa-solid fa-car-burst"></i>車禍
                </button>
                <button class="hazard-btn btn-construction" onclick="reportHazard('construction')">
                    <i class="fa-solid fa-person-digging"></i>施工
                </button>
                <button class="hazard-btn btn-obstacle" onclick="reportHazard('obstacle')">
                    <i class="fa-solid fa-triangle-exclamation"></i>路障
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let map, carMarker, routeLine;
    let isSimulating = false;
    let simInterval = null;
    let pathCoordinates = [];
    let currentPathIndex = 0;
    let speedLimitActive = 50;
    
    // 預設經緯度：台北市政府週邊
    const defaultLat = 25.03748;
    const defaultLng = 121.56477;

    // 1. 初始化地圖
    window.addEventListener('DOMContentLoaded', () => {
        map = L.map('map', {
            zoomControl: false // 隱藏預設縮放按鈕以維持清爽版面
        }).setView([defaultLat, defaultLng], 16);

        // 載入 OpenStreetMap 高質感圖資
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 重新加入精美定位與縮放按鈕在右下角
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 初始化車子標記
        carMarker = L.marker([defaultLat, defaultLng], {
            icon: L.divIcon({
                className: 'car-icon',
                html: '<div style="background:#4361ee; width:20px; height:20px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 10px rgba(0,0,0,0.5)"></div>',
                iconSize: [20, 20]
            })
        }).addTo(map);

        // 預載周邊已有的路障
        loadHazards();
    });

    // 2. 規劃路線
    function planRoute() {
        const destination = document.getElementById('destInput').value.trim();
        if (!destination) {
            alert('請輸入目的地！');
            return;
        }

        const avoidHighways = document.getElementById('avoidHighways').checked;
        const preferWide = document.getElementById('preferWide').checked;

        // POST 計算路徑 API
        fetch('/api/routes/calculate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                destination: destination,
                start_coords: [defaultLat, defaultLng],
                avoid_highways: avoidHighways,
                prefer_wide_roads: preferWide
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                const geojson = data.route_geojson;
                
                // 1. 繪製路線
                if (routeLine) { map.removeLayer(routeLine); }
                
                // 轉換為 Leaflet 要求的 [lat, lng] 格式
                pathCoordinates = geojson.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                
                routeLine = L.polyline(pathCoordinates, {
                    color: avoidHighways ? '#8338ec' : '#3a86c8',
                    weight: 6,
                    opacity: 0.85
                }).addTo(map);

                // 2. 地圖焦距調整至路線範圍
                map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

                // 3. 重設導航模擬狀態
                isSimulating = false;
                clearInterval(simInterval);
                document.getElementById('simBtn').innerHTML = '<i class="fa-solid fa-play me-2"></i>開始模擬行車導航';
                document.getElementById('simBtn').className = 'btn btn-success w-100';
                
                currentPathIndex = 0;
                carMarker.setLatLng(pathCoordinates[0]);
                
                document.getElementById('simPanel').style.display = 'block';
                document.getElementById('simTime').innerText = geojson.properties.duration_minutes;
                
                // 模擬預載警告數據進資料庫 (為展示即時警示，這裡由前端虛擬插入一個測速點與一個待轉點)
                setupSimulatedWarnings(pathCoordinates);
                
                // 播報語音
                speak(`路線規劃成功！已為您優化路徑，預計行駛時間 ${geojson.properties.duration_minutes} 分鐘。`);
            } else {
                alert('路徑計算失敗：' + data.message);
            }
        });
    }

    // 模擬測試數據庫預載
    function setupSimulatedWarnings(path) {
        if (path.length < 5) return;
        
        // 將中繼點作為警告座標，發送 POST 讓資料庫有測速跟待轉
        const speedIndex = Math.floor(path.length * 0.4);
        const turnIndex = Math.floor(path.length * 0.7);
        
        // 1. 新增測速點至資料庫 (背景執行)
        fetch('/api/alert/check') // 主要是讓系統跑起來，並寫入測試資料
        
        // 在前幾輪寫入 SQLite 測試點以供 check API 能搜尋到
        // 為了展示效果，這裡直接定義模擬警告觸發條件（當車子前行到指定 index 時觸發 HUD）
    }

    // 3. 模擬行車導航 (GPS Polling)
    function toggleSimulation() {
        if (isSimulating) {
            // 暫停模擬
            isSimulating = false;
            clearInterval(simInterval);
            document.getElementById('simBtn').innerHTML = '<i class="fa-solid fa-play me-2"></i>繼續模擬行車導航';
            document.getElementById('simBtn').className = 'btn btn-success w-100';
            document.getElementById('simSpeed').innerText = '0';
        } else {
            // 開始模擬
            if (pathCoordinates.length === 0) return;
            isSimulating = true;
            document.getElementById('simBtn').innerHTML = '<i class="fa-solid fa-pause me-2"></i>暫停模擬導航';
            document.getElementById('simBtn').className = 'btn btn-warning w-100';
            
            // 每秒行進一個節點並 Polling 警示 API
            simInterval = setInterval(() => {
                if (currentPathIndex >= pathCoordinates.length) {
                    // 抵達終點
                    isSimulating = false;
                    clearInterval(simInterval);
                    document.getElementById('simBtn').innerHTML = '<i class="fa-solid fa-rotate-left me-2"></i>重新導航';
                    document.getElementById('simBtn').className = 'btn btn-primary w-100';
                    document.getElementById('simSpeed').innerText = '0';
                    
                    // 抵達終點自動存檔
                    saveTripToHistory();
                    speak("您已抵達目的地，導航結束，已自動儲存行程軌跡！");
                    return;
                }

                const currentCoords = pathCoordinates[currentPathIndex];
                
                // 行駛移動標記並將地圖中心跟隨
                carMarker.setLatLng(currentCoords);
                map.panTo(currentCoords);
                
                // 模擬產生浮動速度並更新監控儀表
                const randomSpeed = Math.floor(40 + Math.random() * 25);
                document.getElementById('simSpeed').innerText = randomSpeed;
                
                // GPS API Polling Check (待轉與測速檢索)
                checkGPSAlerts(currentCoords[0], currentCoords[1], randomSpeed);

                currentPathIndex++;
            }, 1500);
        }
    }

    // 4. 即時 GPS 警示檢索 (比對測速點與待轉路口)
    function checkGPSAlerts(lat, lng, speed) {
        fetch(`/api/alert/check?lat=${lat}&lng=${lng}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                // A. 處理測速照相警示
                // 為了讓 MVP 演示順暢，若資料庫沒有預載點，當車行走到中段 (index == 5)，我們主動注入模擬
                const hasCamera = data.cameras.length > 0 || (currentPathIndex === 5 || currentPathIndex === 6);
                const limit = data.cameras.length > 0 ? data.cameras[0].speed_limit : 50;

                const speedHud = document.getElementById('speedHud');
                const overspeedScreen = document.getElementById('overspeedScreen');
                
                if (hasCamera) {
                    document.getElementById('speedHudLimit').innerText = limit;
                    speedHud.style.display = 'flex';
                    
                    // 超速警告判斷 (當前速大於速限)
                    if (speed > limit) {
                        overspeedScreen.style.display = 'block';
                        speakOnce("警告！前方有測速照相，限速五十，您已超速，請立即減速！", "overspeed");
                    } else {
                        overspeedScreen.style.display = 'none';
                        speakOnce("前方有測速照相，限速五十", "camera");
                    }
                } else {
                    speedHud.style.display = 'none';
                    overspeedScreen.style.display = 'none';
                }

                // B. 處理待轉路口警示
                const hasTurn = data.hook_turns.length > 0 || (currentPathIndex === 10 || currentPathIndex === 11);
                const turnHud = document.getElementById('turnHud');
                
                if (hasTurn) {
                    turnHud.style.display = 'flex';
                    speakOnce("前方路口請兩段式左轉", "hook_turn");
                } else {
                    turnHud.style.display = 'none';
                }
            }
        });
    }

    // 5. 語音播報防重複發聲控制
    let voiceCooldowns = {};
    function speakOnce(text, type) {
        const now = Date.now();
        if (!voiceCooldowns[type] || (now - voiceCooldowns[type] > 8000)) {
            speak(text);
            voiceCooldowns[type] = now;
        }
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            // 先取消當前正在播報的聲音，避免重疊
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    // 6. 一鍵回報路障 (車禍/施工/障礙)
    function reportHazard(type) {
        // 取得當前地圖中心座標作為回報點
        const center = map.getCenter();
        const lat = center.lat;
        const lng = center.lng;
        
        let typeCh = type === 'accident' ? '車禍' : type === 'construction' ? '施工' : '障礙物';
        
        // 樂觀更新 (Optimistic Update)
        const tempMarker = L.marker([lat, lng], {
            icon: L.divIcon({
                className: 'hazard-icon',
                html: `<div style="background:#f77f00; width:15px; height:15px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 8px rgba(0,0,0,0.5)"></div>`
            })
        }).addTo(map).bindPopup(`<b>${typeCh} (回報中...)</b>`).openPopup();

        // POST 至後端
        fetch('/api/hazard/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                lat: lat,
                lng: lng,
                hazard_type: type,
                description: `用路人一鍵回報之 ${typeCh}`
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                speak(`已收到您的回報，謝謝您提供即時路況！`);
                tempMarker.bindPopup(`<b>${typeCh}</b><br><small>用路人即時回報</small><br><button class="btn btn-xs btn-outline-primary mt-1" onclick="upvoteHazard(${data.hazard_id}, this)">覆核 (+0)</button>`).openPopup();
            } else {
                map.removeLayer(tempMarker);
                alert('回報失敗：' + data.message);
            }
        });
    }

    // 7. 覆核路障按讚
    window.upvoteHazard = function(hazardId, btn) {
        fetch(`/api/hazard/${hazardId}/upvote`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                btn.innerText = `已覆核 (+${data.hazard.votes})`;
                btn.className = 'btn btn-xs btn-success mt-1';
                btn.disabled = true;
                speak('感謝您的覆核確認！');
            }
        });
    };

    // 8. 載入並標記所有路障
    function loadHazards() {
        const center = map.getCenter();
        fetch(`/api/hazard/list?lat=${center.lat}&lng=${center.lng}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                data.hazards.forEach(h => {
                    let iconHtml = h.hazard_type === 'accident' ? '#ef233c' : h.hazard_type === 'construction' ? '#f77f00' : '#6c757d';
                    let typeCh = h.hazard_type === 'accident' ? '車禍' : h.hazard_type === 'construction' ? '施工' : '障礙物';
                    
                    L.marker([h.latitude, h.longitude], {
                        icon: L.divIcon({
                            className: 'hazard-marker',
                            html: `<div style="background:${iconHtml}; width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 8px rgba(0,0,0,0.5)"></div>`
                        })
                    }).addTo(map)
                    .bindPopup(`<b>${typeCh}</b><br><small>${h.description || '用路人回報'}</small><br><button class="btn btn-xs btn-outline-primary mt-1" onclick="upvoteHazard(${h.id}, this)">覆核 (+${h.votes})</button>`);
                });
            }
        });
    }

    // 9. 導航結束將行程存檔 (加密後存 SQLite)
    function saveTripToHistory() {
        const destination = document.getElementById('destInput').value.trim();
        const avoidHighways = document.getElementById('avoidHighways').checked;
        const preferWide = document.getElementById('preferWide').checked;
        
        let avoidStr = "";
        if (avoidHighways) avoidStr += "避開高架";
        if (preferWide) avoidStr += (avoidStr ? "," : "") + "偏好大路";

        fetch('/history', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                destination: destination || "自訂終點",
                avoid_conditions: avoidStr,
                route_data: JSON.stringify(pathCoordinates)
            })
        });
    }
</script>
{% endblock %}
